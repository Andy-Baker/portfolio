<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio – Testseite</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1a1a1a; --muted: #666; --accent: #2b6cb0; --card: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #eee; --muted: #aaa; --accent: #63b3ed; --card: #1e1e1e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 2.2rem; margin: 0 0 8px; }
    p.lead { color: var(--muted); margin: 0 0 32px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h2 { font-size: 1.1rem; margin: 0 0 6px; }
    a { color: var(--accent); }
    footer { margin-top: 48px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Hallo, ich bin Andy 👋</h1>
    <p class="lead">Das ist eine kleine Testseite für mein Portfolio.</p>

    <section class="grid">
      <div class="card"><h2>Projekt 1</h2><p>Kurze Beschreibung des Projekts.</p></div>
      <div class="card"><h2>Projekt 2</h2><p>Kurze Beschreibung des Projekts.</p></div>
      <div class="card"><h2>Projekt 3</h2><p>Kurze Beschreibung des Projekts.</p></div>
    </section>

    <footer>
      Kontakt: <a href="https://github.com/andy-baker">GitHub</a>
    </footer>
  </main>
</body>
</html>
